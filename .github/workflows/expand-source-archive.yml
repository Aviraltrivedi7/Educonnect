name: Expand Educonnect source archive



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
        with:
        
          fetch-depth: 0
          
      - name: Expand tracked source tree
      
        run: unzip -o educonnect-source.zip -d .
        
      - name: Commit expanded source files
      
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git reset -- .github/workflows/ci.yml
          
          if git diff --cached --quiet; then
          
            echo "No source changes to commit"
            
          else
          
            git commit -m "chore: expand validated Educonnect source tree"
            
            git push
            
          fi
          






















